const defaults={mode:'night',page:'home',role:null,index:0,remaining:5,suggestions:[],likes:[],joined:false,game:0,points:120,claim:false,nightOn:false,shareRole:false,messages:[]};
let s={...defaults,target:0,progressTab:"stats",scope:"near"};let modal=null;let activeGame='Preguntas';
const people=[{name:'Alex',age:28,letter:'a',intent:'Conocer sin prisas',bio:'Café largo, conciertos pequeños y escapadas sin demasiado plan.',tags:['Música en directo','Café','Escapadas']},{name:'Vera',age:27,letter:'v',intent:'Una conexión que sorprenda',bio:'Me quedo con una buena sobremesa y quien me haga reír.',tags:['Arte','Cocina','Humor']},{name:'Leo',age:30,letter:'l',intent:'Planes y nuevas conexiones',bio:'Un paseo acaba mejor si encontramos una terraza.',tags:['Montaña','Terrazas','Cine']},{name:'Noa',age:26,letter:'n',intent:'Amistad y lo que surja',bio:'Tengo una playlist para casi cualquier plan.',tags:['Vinilos','Viajes','Fotografía']}];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const b=(a,t,c='secondary',extra='')=>`<button class="${c}" data-action="${a}" ${extra}>${t}</button>`;
const targets=[{name:'Lucía',age:28,photo:0,letter:'l',intent:'Una conexión con calma',tags:['Música','Escapadas','Humor']},{name:'Marcos',age:32,photo:3,letter:'m',intent:'Conocer y compartir planes',tags:['Café','Viajes','Cine']}];
const personPhoto={Alex:1,Vera:0,Leo:3,Noa:2};
const p=()=>people[s.index%people.length];
const portrait=x=>`<div class="portrait" role="img" aria-label="Retrato generado por IA de ${x.name}, persona ficticia adulta" style="--photo:${x.photo??personPhoto[x.name]}"></div>`;
const art=x=>`<div class="art">${portrait(x)}<div class="art-info"><strong>${x.name}, ${x.age}</strong><p>${x.intent}</p></div></div>`;
function restore(v){if(!v||typeof v!=='object')return;for(const k of ['mode','page','role'])if(typeof v[k]==='string')s[k]=v[k];if(!['night','day'].includes(s.mode))s.mode='night';if(!['home','explore','cupido','social','chat','profile','ranking','game','conversation'].includes(s.page))s.page='home';}
restore(window.openai?.widgetState?.modelContent);
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mode:s.mode,page:s.page,role:s.role},privateContent:null}).catch(()=>{});}
function tell(t){notice.textContent=t;}
function dayHome(){return `<div class="eyebrow">Un lugar. Muchas historias.</div><h1>Hoy, ¿qué<br><span class="accent">te apetece?</span></h1><p class="sub">Hay días para conectar.<br>Y otros para hacer que conecten.</p><div class="grid role-grid">${[['player','flame','Quiero conocer<br>a alguien','Jugador','Encuentra tu propia historia.',1],['cupid','heart-handshake','Hoy quiero<br>ser Cupido','Cupido','Encuentra conexiones para otros.',2]].map(([a,i,t,r,d,photo])=>b(a,`<div class="role-cover">${portrait({name:r,photo})}<span class="role-label">${icon(i)} ${r}</span></div><div class="role-copy"><strong>${t}</strong><small>${d}</small><span class="role-go">${icon('arrow-up-right')}</span></div>`,'role')).join('')}</div><div class="home-foot"><span class="pill">Tu rol puede cambiar contigo</span></div><div class="panel row"><div><h3>Tu huella como Cupido</h3><span class="sub">Estadísticas, liga y recompensas.</span></div>${b('ranking',icon('arrow-up-right'),'plain','aria-label="Abrir estadísticas y ranking"')}</div><button class="plain full" data-action="social">${s.mode==='night'?'La previa · planes y juegos':'Tu círculo · planes y juegos'} →</button>`;}
function home(){if(s.mode==='day')return dayHome();return `<section class="night-intro"><span class="night-kicker">Modo <b>Noche</b> ☾</span><span class="night-script">Las buenas historias<br>empiezan con un hola.</span><div class="night-title"><div class="eyebrow">La ciudad se enciende. Tú eliges.</div><h1>Esta noche,<br><span>¿qué papel juegas?</span></h1><p>Un poco de química.<br>Un plan que no esperabas.</p></div></section><div class="grid night-roles">${[['player','Jugador','Que salten chispas.','Conoce · Conecta',0],['cupid','Cupido','Tú enciendes la historia.','Presenta · Juega',1]].map(([a,t,d,tags,n])=>b(a,`<div class="emblem" style="--emblem:${n}" aria-hidden="true"></div><div class="night-role-copy"><strong>${t}</strong><span>${d}</span><div class="role-orb">${icon('arrow-right')}</div><small>${tags}</small></div>`,'night-role '+a)).join('')}</div><div class="night-shortcuts">${[['explore','heart','Personas'],['plan','wine','Planes'],['social','users','Grupos'],['questions','dices','Juegos']].map(([a,i,t])=>b(a,`${icon(i)}<span>${t}</span>`,'night-shortcut')).join('')}</div><div class="row night-section"><h2>Tu próximo <span class="accent">plot twist</span></h2>${b('explore','Ver perfiles ↗','plain')}</div><div class="teaser-grid">${[people[1],people[0],people[3]].map((x,i)=>b('teaser-'+i,`${portrait(x)}<div><strong>${x.name}, ${x.age}</strong></div>`,'teaser')).join('')}</div><div class="night-progress"><div><span class="eyebrow">Cupido también juega</span><h3>¿Tienes ojo para la química?</h3></div>${b('ranking',icon('trophy'),'plain','aria-label="Abrir estadísticas y ranking"')}</div><button class="plain full" data-action="social">La previa está aquí · entra a jugar →</button>`;}
function explore(){const x=p();return `<div class="row"><div><div class="eyebrow">Jugador</div><h1>Descubre</h1></div>${b('filters',icon('sliders-horizontal'),'secondary','aria-label="Preferencias de descubrimiento"')}</div><div class="steps">${people.map((_,i)=>`<span class="${i===s.index%people.length?'used':''}"></span>`).join('')}</div>${art(x)}<p class="sub">${x.bio}</p><div>${x.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div><div class="actions">${b('skip',icon('x'),'circle','aria-label="Pasar perfil"')}${b('like',icon('heart'),'circle love','aria-label="Me interesa"')}${b('details',icon('ellipsis'),'circle','aria-label="Detalles y opciones"')}</div><div class="hint" style="text-align:center">Un like expresa interés. La conexión llega si es mutua.</div>`;}
function cupido(){const x=p(),t=targets[s.target];return `<div class="row"><div><div class="eyebrow">Conectar también es un talento</div><h1>Haz de Cupido<span class="accent">.</span></h1></div><span class="count" aria-label="${s.remaining} propuestas restantes">${s.remaining}<small style="font-size:13px;color:var(--muted)"> / 5</small></span></div><label>Estoy buscando una conexión para<select id="dn-target">${targets.map((t,i)=>`<option value="${i}" ${s.target===i?'selected':''}>${t.name}, ${t.age}</option>`).join('')}</select></label><div class="pair-labels"><span>Tu persona · se queda</span><span>Tu propuesta · desliza</span></div><div class="cupido-grid"><div class="fixed-person" data-person="${t.name}">${art(t)}</div><div class="candidate-person" data-candidate="${x.name}" aria-label="Candidato. Desliza horizontalmente para cambiarlo">${art(x)}<button class="swipe-help plain" data-action="skip">Otro perfil ${icon('move-horizontal')}</button></div></div><div class="pair-tags"><span>${t.tags.slice(0,2).join(' · ')}</span><span>${x.tags.slice(0,2).join(' · ')}</span></div><div class="actions">${b('skip',icon('x'),'circle','aria-label="Pasar candidato"')}${b('suggest',icon('heart'),'circle love',`aria-label="Proponer conexión entre ${t.name} y ${x.name}" ${s.remaining===0?'disabled':''}`)}${b('details',icon('info'),'circle','aria-label="Conocer al candidato"')}</div><p class="pair-caption">${s.remaining?'¿Les ves conexión? Tú los presentas.':'Has usado las cinco propuestas de esta sesión.'}<br><span class="hint">Ellos deciden si quieren conocerse.</span></p><div class="steps">${Array.from({length:5},(_,i)=>`<span class="${i>=s.remaining?'used':''}"></span>`).join('')}</div><div class="row"><span class="hint">${s.suggestions.length} presentaciones en esta sesión</span>${b('ranking','Mi progreso ↗','plain')}</div>`;}
function social(){return `<div class="eyebrow">${s.mode==='night'?'Night club':'Tu círculo'}</div><h1>La previa<span class="accent">.</span></h1><p class="sub">El plan empieza mucho antes de salir.</p><div class="panel"><div class="row">${icon('users')}</div><h2>Los de siempre</h2><p class="sub">Lucía · Cupido &nbsp; / &nbsp; Marcos · Jugador<br>Noa · Cupido &nbsp; / &nbsp; Tú · ${s.role==='cupid'?'Cupido':'Jugador'}</p>${b('join',s.joined?'Salir del grupo':'Entrar al grupo','primary full')}</div><h2>¿A qué jugamos?</h2><div class="grid">${b('questions',`${icon('messages-square')}<h3>Preguntas</h3><span class="sub">Una buena excusa.</span>`,'panel')}${b('truth',`${icon('sparkles')}<h3>Verdad o reto</h3><span class="sub">Tú pones el límite.</span>`,'panel')}</div><div class="listrow"><div class="mini">↗</div><div><h3>Un plan sin complicarse</h3><p>Terraza y conversación</p></div>${b('plan','Ver','plain')}</div>${b('cards','Cartas entre amigos · explorar idea →','plain full')}`;}
function ranking(){const lists={near:[['Lucía',180,0],['Noa',150,2],['Tú',120,1],['Marcos',90,3]],madrid:[['Noa',540,2],['Marcos',460,3],['Lucía',310,0],['Tú',120,1]],national:[['Marcos',980,3],['Lucía',860,0],['Noa',740,2],['Tú',120,1]]};const labels={near:'Cerca de mí',madrid:'Madrid',national:'Nacional'};return `<div class="eyebrow">Tu huella como Cupido</div><h1>Conectar<br><span class="accent">tiene su historia.</span></h1><div class="progress-tabs" role="tablist" aria-label="Progreso de Cupido">${b('stats','Mis estadísticas','',`role="tab" id="stats-tab" aria-controls="progress-panel" aria-selected="${s.progressTab==='stats'}"`)}${b('ranktab','Ranking','',`role="tab" id="rank-tab" aria-controls="progress-panel" aria-selected="${s.progressTab==='rank'}"`)}</div><section id="progress-panel" role="tabpanel" aria-labelledby="${s.progressTab==='stats'?'stats-tab':'rank-tab'}">${s.progressTab==='stats'?`<div class="stats-hero"><span class="sub">Presentaciones de esta sesión</span><div class="stat-big">${s.suggestions.length}<span> / 5</span></div><div class="steps">${Array.from({length:5},(_,i)=>`<span class="${i<s.suggestions.length?'used':''}"></span>`).join('')}</div><div class="stat-grid"><div><strong>${s.remaining}</strong><span>Por proponer</span></div><div><strong>0</strong><span>Respuestas recibidas</span></div></div><h2>Las historias que has empezado</h2>${s.suggestions.length?s.suggestions.map(q=>`<div class="listrow"><div class="mini">♡</div><div><strong>${q.target} + ${q.candidate}</strong><p>Pendiente</p></div></div>`).join(''):`<div class="empty-stats"><span class="mini">♡</span><h3>Tu primera conexión empieza aquí</h3><p class="sub">Elige a quién ayudar y encuentra a alguien que encaje.</p>${b('cupido','Hacer de Cupido','primary')}</div>`}`:`<div class="scope-tabs" aria-label="Ámbito de clasificación">${Object.entries(labels).map(([key,label])=>b('scope-'+key,label,'',`aria-pressed="${s.scope===key}"`)).join('')}</div><div class="rank-leader">${portrait({name:lists[s.scope][0][0],photo:lists[s.scope][0][2]})}<div><span class="eyebrow">Primera conexión de la liga</span><h2>${lists[s.scope][0][0]}</h2><span>${lists[s.scope][0][1]} puntos</span></div><span class="trophy">${icon('trophy')}</span></div><div class="rank-list">${lists[s.scope].map(([name,pts,photo],i)=>`<div class="listrow ${name==='Tú'?'is-you':''}"><span class="rank-number">${i+1}</span><div class="rank-avatar">${portrait({name,photo})}</div><div><strong>${name}</strong><p>${name==='Tú'?'Tu posición':'Cupido'}</p></div><strong>${pts}<small> pts</small></strong></div>`).join('')}</div>`}</section><div class="reward-strip"><div><strong>Tu primera insignia</strong><p class="hint">Un detalle por conectar historias.</p></div>${b('claim',s.claim?'Conseguida':'Probar','secondary',s.claim?'disabled':'')}</div>`;}
function chat(){return `<div class="eyebrow">Las historias continúan</div><h1>Conversaciones</h1>${[['A','Alex','¿Café y una playlist compartida?'],['L','La previa','El grupo está preparando un plan.']].map(([l,n,t],i)=>`<button data-action="${i?'social':'conversation'}" class="listrow listbutton"><span class="mini">${l}</span><div><strong>${n}</strong><p>${t}</p></div>${icon('chevron-right')}</button>`).join('')}<div class="panel" style="margin-top:25px"><h3>Tus propuestas de Cupido</h3><p class="sub">${s.suggestions.length?s.suggestions.length+' presentaciones pendientes de respuesta.':'Todavía no has propuesto ninguna presentación.'}</p>${b('cupido','Hacer de Cupido','plain')}</div>`;}
function conversation(){return `${b('chat','← Conversaciones','plain')}<div class="row"><h1>Alex</h1>${b('safety',icon('shield'),'plain','aria-label="Opciones de seguridad"')}</div><div class="bubble">¿Café y una playlist compartida?</div><div id="dn-messages"></div><form id="dn-form"><label>Tu mensaje<input id="dn-message" type="text" maxlength="200" placeholder="Escribe algo…" autocomplete="off"></label><button class="primary full" type="button" data-action="send">Añadir mensaje</button></form>`;}
function profile(){return `<div class="eyebrow">Tu espacio</div><h1>A tu manera<span class="accent">.</span></h1><div class="panel row"><div class="mini">T</div><div><h3>Tu perfil</h3><span class="sub">${s.role==='cupid'?'Cupido':'Jugador'}${s.claim?' · Insignia Cupido ✦':''}</span></div></div><h2>Hoy me apetece</h2><div class="grid">${b('player','Ser Jugador',s.role==='player'?'primary':'secondary')}${b('cupid','Ser Cupido',s.role==='cupid'?'primary':'secondary')}</div><label><input type="checkbox" id="dn-exposure" ${s.nightOn?'checked':''}> Mostrar mi perfil en Night</label><label><input type="checkbox" id="dn-share" ${s.shareRole?'checked':''}> Compartir mi rol con mis amigos</label><div class="listrow"><div><h3>Mi actividad</h3><p>${s.likes.length} likes · ${s.suggestions.length} propuestas de Cupido</p></div></div>${b('rewards','Recompensas y progreso →','plain full')}${b('safety','Privacidad y seguridad →','plain full')}<details class="about-demo"><summary>Acerca de esta versión</summary><p class="hint">Mockup para un producto de adultos (18+). Personas e imágenes generadas por IA, rankings y actividad ficticios. Mensajes, propuestas y planes son locales; no se envían a otras personas. No hay moderación ni reservas conectadas.</p>${b('reset','Reiniciar demostración','secondary full')}</details>`;}
const questions=['¿Qué plan improvisado te ha salido sorprendentemente bien?','¿Qué canción pondrías para romper el hielo?','¿Cuál sería una primera cita muy tú?','¿Qué detalle te hace querer seguir una conversación?'];
const truths=['Verdad: ¿qué te llama la atención antes de conocer a alguien?','Reto: inventa un nombre para el grupo.','Verdad: ¿qué plan siempre te conquista?','Reto: describe tu cita ideal con tres palabras.'];
function game(){const q=activeGame==='Preguntas'?questions:truths;return `${b('social','← La previa','plain')}<div class="eyebrow">En juego</div><h1>${activeGame}</h1><p class="sub">Puedes pasar una tarjeta o salir cuando quieras.</p><div class="gamecard"><span class="eyebrow">Carta ${s.game%4+1}</span><p></p><strong>${q[s.game%4]}</strong></div>${b('nextcard','Siguiente tarjeta','primary full')}${b('passcard','Paso esta vez','secondary full')}`;}
function render(){root.dataset.mode=s.mode;root.dataset.page=s.page;root.querySelectorAll('.mode button').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.action===s.mode)));const pages={home,explore,cupido,social,chat,profile,ranking,game,conversation};content.innerHTML=(pages[s.page]||home)();root.querySelector('nav').innerHTML=[['home','house','Inicio'],['explore','compass','Descubre'],['cupido','heart-handshake','Cupido'],['chat','message-circle','Chats'],['profile','user-round','Perfil']].map(([a,i,l])=>b(a,icon(i)+`<span>${l}</span>`,'',s.page===a?'aria-current="page"':'')).join('');if(s.page==='conversation'){const box=root.querySelector('#dn-messages');s.messages.forEach(t=>{const el=document.createElement('div');el.className='bubble mine';el.textContent=t;box.append(el);});}renderModal();if(globalThis.lucide)lucide.createIcons();}
function renderModal(){if(!modal){overlay.innerHTML='';return;}let title='',body='';if(modal==='night'){title='La noche, a tu manera';body=`<p class="sub">Elige tu rol para explorar Night. Entrar aquí no activa la visibilidad de tu perfil.</p><div class="grid">${b('nightplayer','Jugador','primary')}${b('nightcupid','Cupido','secondary')}</div>`;}if(modal==='filters'){title='Tu zona y tus intenciones';body=`<label>Zona aproximada<select><option>Madrid</option><option>Torrelodones</option></select></label><label>Me apetece<select><option>Conocer sin prisas</option><option>Amistad y planes</option><option>Una relación</option></select></label>${b('close','Listo','primary full')}`;}if(modal==='details'){title=p().name+', '+p().age;body=`<p>${p().bio}</p>${b('safety','Bloquear o denunciar','secondary full')}`;}if(modal==='rewards'){title='Ser Cupido tiene su historia';body=`<p class="sub">Conecta historias y descubre tus recompensas.</p><div class="listrow">✦ Insignias y reconocimiento</div><div class="listrow">↗ Retos entre amigos</div><div class="listrow">♡ Agradecimientos compartidos</div>${b('ranking','Ver mi progreso','primary full')}`;}if(modal==='plan'){title='Terraza y conversación';body=`<p>Una terraza, tu círculo y una buena conversación.</p>${b('planjoin','Me apunto','primary full')}`;}if(modal==='cards'){title='Cartas entre amigos';body=`<p class="sub">Una carta puede cambiar la partida.</p><div class="listrow">Comodín · propone otra pregunta</div><div class="listrow">Protección · pasa un reto</div><div class="listrow">Clausulazo · reglas pendientes</div><p class="hint">Más cartas, próximamente.</p>${b('questions','Jugar','primary full')}`;}if(modal==='safety'){title='Tú decides con quién';body=`<p class="sub">Acciones de muestra. No hay personas reales ni un servicio de moderación conectado.</p>${b('block','Simular bloqueo','secondary full')}${b('report','Simular denuncia','secondary full')}`;}overlay.innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="row"><h2>${title}</h2>${b('close',icon('x'),'plain','aria-label="Cerrar"')}</div>${body}</section></div>`;}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;if(a==='send'){const input=root.querySelector('#dn-message'),t=input.value.trim();if(t){s.messages.push(t);render();tell('Mensaje añadido localmente; no se ha enviado.');}return;}tell('');if(['home','explore','cupido','social','chat','profile','ranking','conversation'].includes(a)){s.page=a;modal=null;}else if(a.startsWith('teaser-')){s.index=[1,0,3][Number(a.slice(7))]??0;s.page='explore';modal=null;}else if(a==='stats'||a==='ranktab'){s.progressTab=a==='stats'?'stats':'rank';}else if(a.startsWith('scope-')){const scope=a.slice(6);if(['near','madrid','national'].includes(scope))s.scope=scope;}else if(a==='day'){s.mode='day';modal=null;}else if(a==='night'){if(s.mode!=='night')modal='night';}else if(['player','cupid','nightplayer','nightcupid'].includes(a)){s.role=a.includes('cupid')?'cupid':'player';s.page=s.role==='cupid'?'cupido':'explore';if(a.startsWith('night'))s.mode='night';modal=null;}else if(a==='skip'){s.index++;}else if(a==='like'){s.likes.push(p().name);s.index++;tell('Like guardado.');}else if(a==='suggest'&&s.remaining>0){s.suggestions.push({target:targets[s.target].name,candidate:p().name});s.remaining--;s.index++;tell('Propuesta guardada.');}else if(['filters','details','rewards','plan','cards','safety'].includes(a)){modal=a;}else if(a==='close'){modal=null;}else if(a==='join'){s.joined=!s.joined;tell(s.joined?'Has entrado al grupo.':'Has salido del grupo.');}else if(['questions','truth'].includes(a)){activeGame=a==='truth'?'Verdad o reto':'Preguntas';s.game=0;s.page='game';modal=null;}else if(['nextcard','passcard'].includes(a)){s.game++;if(a==='passcard')tell('Tarjeta pasada, sin penalización.');}else if(a==='claim'){s.claim=true;tell('Insignia añadida a tu perfil.');}else if(a==='planjoin'){modal=null;tell('Interés simulado. No existe una reserva ni una quedada real.');}else if(a==='block'||a==='report'){modal=null;tell(a==='block'?'Bloqueo simulado; no afecta a personas reales.':'Denuncia simulada; no se ha enviado a moderación.');}else if(a==='reset'){s={...defaults,target:0,progressTab:'stats',scope:'near',suggestions:[],likes:[],messages:[]};modal=null;tell('Demostración reiniciada.');}render();save();});
root.addEventListener('change',e=>{if(!['dn-exposure','dn-share','dn-target'].includes(e.target.id))return;if(e.target.id==='dn-exposure'){s.nightOn=e.target.checked;tell('Preferencia guardada.');}if(e.target.id==='dn-share')s.shareRole=e.target.checked;if(e.target.id==='dn-target'){s.target=Number(e.target.value);render();}save();});
root.addEventListener('submit',e=>{if(e.target.id!=='dn-form')return;e.preventDefault();const input=root.querySelector('#dn-message'),t=input.value.trim();if(t){s.messages.push(t);render();tell('Mensaje añadido localmente; no se ha enviado.');}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dn-message'){e.preventDefault();root.querySelector('[data-action=send]').click();}if(e.key==='Escape'&&modal){modal=null;render();}});
window.addEventListener('openai:set_globals',e=>{const before=[s.mode,s.page,s.role].join('|');restore(e.detail?.globals?.widgetState?.modelContent);if(before!==[s.mode,s.page,s.role].join('|'))render();});
let swipeStart=null;
root.addEventListener('pointerdown',e=>{if(e.target.closest('.candidate-person .art'))swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};});
root.addEventListener('pointercancel',()=>{swipeStart=null;});
root.addEventListener('pointerup',e=>{if(!swipeStart||e.pointerId!==swipeStart.id)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5){s.index++;render();tell('');save();}});
render();
if(globalThis.Tweak){const design={radius:24};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--radius',design.radius+'px')});tweak.addSlider(design,'radius',{label:'Redondez de las tarjetas',min:10,max:30,unit:'px'});}
})();
</script>
