<div class="viz-dotted-background" style="padding:18px 0">
<div id="dn-mobile" data-mode="night" aria-label="Prototipo móvil Day Night">
<style>
#dn-mobile{--bg:#140e1c;--surface:#211729;--ink:#fff5fa;--muted:#c5b3c7;--line:#443047;--pink:#f95caa;--soft:#382039;--radius:24px;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);max-width:410px;margin:auto;border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:0 20px 65px #170d2528;font-size:14px;line-height:1.5;color-scheme:dark}
#dn-mobile[data-mode=day]{--bg:#fffaf4;--surface:#fff;--ink:#382732;--muted:#75616b;--line:#eadbdc;--pink:#aa365e;--soft:#f8e8e8;color-scheme:light}
#dn-mobile *{box-sizing:border-box}#dn-mobile button,#dn-mobile input,#dn-mobile select{font:inherit}#dn-mobile button{cursor:pointer;color:inherit}#dn-mobile button:focus-visible,#dn-mobile input:focus-visible,#dn-mobile select:focus-visible{outline:3px solid var(--pink);outline-offset:3px}#dn-mobile button:disabled{opacity:.45;cursor:not-allowed}#dn-mobile button{transition:background .15s}#dn-mobile .status{display:flex;justify-content:space-between;padding:15px 24px 5px;font-size:12px;font-weight:600}#dn-mobile .brand{padding:15px 22px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}#dn-mobile .wordmark{font-size:23px;font-weight:750;letter-spacing:-1px}#dn-mobile .wordmark span{color:var(--pink)}#dn-mobile .mode{display:flex;border:1px solid var(--line);border-radius:30px;padding:3px;background:var(--surface)}#dn-mobile .mode button{border:0;background:transparent;border-radius:25px;min-height:38px;padding:6px 12px;font-size:12px}#dn-mobile .mode button[aria-pressed=true]{background:var(--soft);color:var(--pink)}#dn-mobile .demo{padding:0 22px 12px;font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}#dn-mobile main{padding:8px 22px 24px;min-height:540px}#dn-mobile h1{font-size:32px;line-height:1.12;letter-spacing:-1.2px;margin:12px 0}#dn-mobile h2{font-size:19px;letter-spacing:-.5px;margin:20px 0 10px}#dn-mobile h3{font-size:16px;margin:0 0 5px}#dn-mobile p{margin:8px 0 16px}#dn-mobile .sub{color:var(--muted);font-size:13px}#dn-mobile .eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--pink);font-weight:700}#dn-mobile .accent{color:var(--pink)}#dn-mobile .row{display:flex;align-items:center;justify-content:space-between;gap:12px}#dn-mobile .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#dn-mobile .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}#dn-mobile .primary{background:var(--pink);color:var(--bg);border:0;border-radius:16px;padding:13px 18px;min-height:46px;font-weight:700}#dn-mobile .secondary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 15px;min-height:46px}#dn-mobile .full{width:100%;margin-top:12px}#dn-mobile .plain{background:none;border:0;color:var(--pink);padding:8px 0;min-height:44px}#dn-mobile .pill{display:inline-block;padding:5px 10px;border-radius:24px;background:var(--soft);font-size:11px;color:var(--ink);margin:3px 3px 3px 0}#dn-mobile .role{text-align:left;min-height:245px;position:relative;overflow:hidden;padding:18px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}#dn-mobile .role strong{display:block;font-size:23px;letter-spacing:-.7px}#dn-mobile .role .role-art{height:105px;display:flex;align-items:center;justify-content:center;color:var(--pink);background:radial-gradient(ellipse at center,#f4519c26,transparent 65%);margin-bottom:8px}#dn-mobile .role-art svg{width:63px!important;height:63px!important;stroke-width:1.2;filter:drop-shadow(0 0 14px #f4529c55)}#dn-mobile .role small{display:block;color:var(--muted);font-size:12px;margin-top:6px}#dn-mobile .role .arrow{position:absolute;right:14px;bottom:13px;color:var(--pink)}#dn-mobile .art{height:270px;position:relative;overflow:hidden;border-radius:var(--radius);background:radial-gradient(ellipse at 20% 15%,#f0ad944d,transparent 55%),linear-gradient(145deg,#5d3656,#23192c 70%);display:flex;align-items:center;justify-content:center;color:#ffe6ed}#dn-mobile[data-mode=day] .art{background:radial-gradient(ellipse at 20% 15%,#f8dd9a,transparent 65%),linear-gradient(145deg,#b78b87,#65445e)}#dn-mobile .art:before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;border:1px solid #ffffff22;transform:translate(40px,-20px)}#dn-mobile .monogram{font-family:Georgia,serif;font-size:115px;opacity:.65;font-style:italic}#dn-mobile .art-info{position:absolute;bottom:0;left:0;right:0;padding:45px 18px 16px;background:linear-gradient(transparent,#1b101fe6)}#dn-mobile .art-info strong{font-size:26px;color:#fff}#dn-mobile .art-info p{margin:2px 0;color:#eee0ea;font-size:12px}#dn-mobile .art-tag{position:absolute;top:13px;left:13px;font-size:10px;padding:5px 9px;border-radius:20px;background:#201525c9;color:#ffeaf4}#dn-mobile .actions{display:flex;gap:14px;justify-content:center;margin:18px 0}#dn-mobile .circle{height:55px;width:55px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}#dn-mobile .circle.love{background:var(--pink);color:var(--bg);width:66px;height:66px;margin-top:-5px}#dn-mobile svg{width:20px;height:20px;vertical-align:middle}#dn-mobile .mini{width:45px;height:45px;flex-shrink:0;display:grid;place-items:center;border-radius:16px;color:var(--pink);background:var(--soft);font-family:Georgia,serif;font-size:23px}#dn-mobile .listrow{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}#dn-mobile .listrow>div:nth-child(2){flex:1}#dn-mobile .listrow p{margin:2px 0;font-size:12px;color:var(--muted)}#dn-mobile .listbutton{width:100%;background:none;border:0;text-align:left}#dn-mobile .cupido-grid{display:grid;grid-template-columns:105px 1fr;gap:12px;margin-top:15px}#dn-mobile .anchor{padding:12px;text-align:center;border-radius:var(--radius);background:var(--soft)}#dn-mobile .anchor .mini{margin:10px auto;width:60px;height:70px}#dn-mobile .cupido-grid .art{height:238px}#dn-mobile .cupido-grid .monogram{font-size:75px}#dn-mobile .cupido-grid .art-info strong{font-size:21px}#dn-mobile .count{font-size:29px;font-weight:700;color:var(--pink)}#dn-mobile label{display:block;margin:12px 0;color:var(--muted);font-size:12px}#dn-mobile input[type=text],#dn-mobile select{width:100%;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);margin-top:6px;min-height:44px}#dn-mobile input[type=checkbox]{accent-color:var(--pink);width:18px;height:18px;vertical-align:middle;margin-right:8px}#dn-mobile .bubble{background:var(--surface);padding:14px;border-radius:18px 18px 18px 3px;max-width:87%;margin:14px 0}#dn-mobile .bubble.mine{background:var(--soft);margin-left:auto;border-radius:18px 18px 3px 18px}#dn-mobile .gamecard{min-height:185px;text-align:center;display:flex;flex-direction:column;justify-content:center;background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);padding:23px}#dn-mobile .gamecard strong{font-size:22px;line-height:1.35}#dn-mobile .score{font-size:52px;letter-spacing:-3px;margin:0;color:var(--pink)}#dn-mobile nav{display:grid;grid-template-columns:repeat(5,1fr);padding:11px 9px 16px;border-top:1px solid var(--line);background:var(--surface);gap:2px}#dn-mobile nav button{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;border:0;background:none;min-height:48px;font-size:10px;color:var(--muted);padding:4px 0}#dn-mobile nav button[aria-current=page]{color:var(--pink)}#dn-mobile .notice{padding:10px 20px;background:var(--soft);font-size:12px;color:var(--ink)}#dn-mobile .notice:empty{display:none}#dn-mobile .overlay{position:absolute;inset:0;background:#08050c99;z-index:10;display:flex;align-items:flex-end;padding:12px}#dn-mobile .sheet{background:var(--bg);border:1px solid var(--line);padding:23px;border-radius:26px;width:100%;box-shadow:0 -12px 55px #0005}#dn-mobile .sheet h2{margin-top:0}#dn-mobile .canvas{position:relative}#dn-mobile .footerline{height:4px;width:95px;background:var(--muted);opacity:.5;border-radius:10px;margin:0 auto 10px}#dn-mobile .steps{display:flex;gap:5px;margin:10px 0}#dn-mobile .steps span{height:4px;background:var(--line);flex:1;border-radius:3px}#dn-mobile .steps span.used{background:var(--pink)}#dn-mobile .hint{font-size:11px;color:var(--muted)}
@media(max-width:360px){#dn-mobile main{padding:8px 15px 18px}#dn-mobile .brand{padding-left:15px;padding-right:15px}#dn-mobile h1{font-size:28px}#dn-mobile .role{padding:15px 12px}#dn-mobile .cupido-grid{grid-template-columns:90px 1fr}}
@media(prefers-reduced-motion:reduce){#dn-mobile *{transition:none!important}}
</style>
<div class="status"><span>9:41</span><span>● ● ● &nbsp; 100%</span></div>
<header class="brand"><div class="wordmark">day<span> / </span>night</div><div class="mode" aria-label="Modo de experiencia"><button data-action="day" aria-pressed="false">☀ Day</button><button data-action="night" aria-pressed="true">☾ Night</button></div></header>
<div class="demo">Prototipo · 18+ · personas y actividad ficticias</div>
<div class="canvas"><main id="dn-content"></main><div id="dn-overlay"></div></div>
<div id="dn-notice" class="notice" role="status" aria-live="polite"></div>
<nav aria-label="Navegación principal"></nav><div class="footerline"></div>
</div></div>
<script>
(()=>{
const root=document.getElementById('dn-mobile'),content=root.querySelector('#dn-content'),overlay=root.querySelector('#dn-overlay'),notice=root.querySelector('#dn-notice');
const defaults={mode:'night',page:'home',role:null,index:0,remaining:5,suggestions:[],likes:[],joined:false,game:0,points:120,claim:false,nightOn:false,shareRole:false,messages:[]};
let s={...defaults};let modal=null;let activeGame='Preguntas';
const people=[{name:'Alex',age:28,letter:'a',intent:'Conocer sin prisas',bio:'Café largo, conciertos pequeños y escapadas sin demasiado plan.',tags:['Música en directo','Café','Escapadas']},{name:'Vera',age:27,letter:'v',intent:'Una conexión que sorprenda',bio:'Me quedo con una buena sobremesa y quien me haga reír.',tags:['Arte','Cocina','Humor']},{name:'Leo',age:30,letter:'l',intent:'Planes y nuevas conexiones',bio:'Un paseo acaba mejor si encontramos una terraza.',tags:['Montaña','Terrazas','Cine']},{name:'Noa',age:26,letter:'n',intent:'Amistad y lo que surja',bio:'Tengo una playlist para casi cualquier plan.',tags:['Vinilos','Viajes','Fotografía']}];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const b=(a,t,c='secondary',extra='')=>`<button class="${c}" data-action="${a}" ${extra}>${t}</button>`;
const p=()=>people[s.index%people.length];
const art=x=>`<div class="art"><span class="art-tag">Perfil de ejemplo</span><span class="monogram">${x.letter}</span><div class="art-info"><strong>${x.name}, ${x.age}</strong><p>${x.intent}</p></div></div>`;
function restore(v){if(!v||typeof v!=='object')return;for(const k of ['mode','page','role'])if(typeof v[k]==='string')s[k]=v[k];if(!['night','day'].includes(s.mode))s.mode='night';if(!['home','explore','cupido','social','chat','profile','ranking','game','conversation'].includes(s.page))s.page='home';}
restore(window.openai?.widgetState?.modelContent);
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mode:s.mode,page:s.page,role:s.role},privateContent:null}).catch(()=>{});}
function tell(t){notice.textContent=t;}
function home(){return `<div class="eyebrow">${s.mode==='night'?'La noche tiene otra historia':'Conecta a tu manera'}</div><h1>${s.mode==='night'?'¿Cómo quieres entrar<br><span class="accent">esta noche?</span>':'Buenas historias.<br><span class="accent">Sin ninguna prisa.</span>'}</h1><p class="sub">Conoce a alguien. Conecta a tus amigos.<br>O ven a echarte unas risas.</p><div class="grid">${[['player','flame','Jugador','Tu historia empieza con un hola.'],['cupid','heart-handshake','Cupido','Hay conexiones que tú ves primero.']].map(([a,i,t,d])=>b(a,`<div class="role-art">${icon(i)}</div><strong>${t}</strong><small>${d}</small><span class="arrow">↗</span>`,'role')).join('')}</div><h2>Tu círculo, tu juego</h2><div class="panel row"><div><h3>La previa</h3><span class="sub">Planes, preguntas y piques sanos.</span></div>${b('social',icon('arrow-up-right'),'plain','aria-label="Abrir La previa"')}</div><button class="plain full" data-action="ranking">Ver la liga de amigos →</button>`;}
function explore(){const x=p();return `<div class="row"><div><div class="eyebrow">Jugador</div><h1>Descubre</h1></div>${b('filters',icon('sliders-horizontal'),'secondary','aria-label="Preferencias de descubrimiento"')}</div><div class="steps">${people.map((_,i)=>`<span class="${i===s.index%people.length?'used':''}"></span>`).join('')}</div>${art(x)}<p class="sub">${x.bio}</p><div>${x.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div><div class="actions">${b('skip',icon('x'),'circle','aria-label="Pasar perfil"')}${b('like',icon('heart'),'circle love','aria-label="Me interesa"')}${b('details',icon('ellipsis'),'circle','aria-label="Detalles y opciones"')}</div><div class="hint" style="text-align:center">Un like expresa interés. La conexión llega si es mutua.</div>`;}
function cupido(){const x=p();return `<div class="row"><div><div class="eyebrow">Tu intuición conecta</div><h1>Modo Cupido</h1></div><span class="count">${s.remaining}<small style="font-size:13px;color:var(--muted)"> / 5</small></span></div><label>¿A quién quieres presentar?<select id="dn-target"><option>Lucía, 27 · busca conexión</option><option>Marcos, 29 · abierto a conocer</option></select></label><div class="cupido-grid"><aside class="anchor"><span class="hint">Tu persona</span><div class="mini" id="dn-target-letter">L</div><strong id="dn-target-name">Lucía</strong><p class="hint">Música<br>Escapadas<br>Humor</p><span class="pill">Acepta Cupido</span></aside>${art(x)}</div><div class="steps">${Array.from({length:5},(_,i)=>`<span class="${i>=s.remaining?'used':''}"></span>`).join('')}</div><div class="actions">${b('skip',icon('x'),'circle','aria-label="Otro candidato"')}${b('suggest',icon('heart-handshake'),'circle love',`aria-label="Proponer presentación" ${s.remaining===0?'disabled':''}`)}</div><p class="hint" style="text-align:center">${s.suggestions.length} propuestas en esta sesión · Ambas personas deciden.</p>${b('rewards','Mis recompensas de Cupido →','secondary full')}`;}
function social(){return `<div class="eyebrow">${s.mode==='night'?'Night club':'Tu círculo'}</div><h1>La previa<span class="accent">.</span></h1><p class="sub">El plan empieza mucho antes de salir.</p><div class="panel"><div class="row"><span class="pill">Grupo de ejemplo</span>${icon('users')}</div><h2>Los de siempre</h2><p class="sub">Lucía · Cupido &nbsp; / &nbsp; Marcos · Jugador<br>Noa · Cupido &nbsp; / &nbsp; Tú · ${s.role==='cupid'?'Cupido':'Jugador'}</p>${b('join',s.joined?'Salir del grupo de prueba':'Entrar al grupo de prueba','primary full')}</div><h2>¿A qué jugamos?</h2><div class="grid">${b('questions',`${icon('messages-square')}<h3>Preguntas</h3><span class="sub">Una buena excusa.</span>`,'panel')}${b('truth',`${icon('sparkles')}<h3>Verdad o reto</h3><span class="sub">Tú pones el límite.</span>`,'panel')}</div><div class="listrow"><div class="mini">↗</div><div><h3>Un plan sin complicarse</h3><p>Terraza y conversación · ejemplo</p></div>${b('plan','Ver','plain')}</div>${b('cards','Cartas entre amigos · explorar idea →','plain full')}`;}
function ranking(){return `<div class="eyebrow">Competir también conecta</div><h1>La liga<br><span class="accent">de tus amigos.</span></h1><p class="sub">Clasificación de ejemplo · reglas por definir</p><div class="panel row"><div><span class="sub">Tus puntos de juego</span><div class="score">${s.points}</div></div><div class="mini">✦</div></div>${[['1','Lucía','Cupido','180'],['2','Noa','Cupido','150'],['3','Tú','Tu partida',s.points]].map(([n,name,d,pts])=>`<div class="listrow"><div class="mini">${n}</div><div><strong>${name}</strong><p>${d}</p></div><strong>${pts} pts</strong></div>`).join('')}<h2>Un premio por conectar</h2><p class="sub">Prueba una insignia de Cupido. Las recompensas son propuestas de diseño.</p>${b('claim',s.claim?'Insignia en tu perfil':'Probar insignia · sin coste','primary full',s.claim?'disabled':'')}<p class="hint">El orden es ilustrativo. No hay compras de visibilidad.</p>`;}
function chat(){return `<div class="eyebrow">Las historias continúan</div><h1>Conversaciones</h1><p class="sub">Escenarios de muestra, no matches reales.</p>${[['A','Alex','¿Café y una playlist compartida?'],['L','La previa','El grupo está preparando un plan.']].map(([l,n,t],i)=>`<button data-action="${i?'social':'conversation'}" class="listrow listbutton"><span class="mini">${l}</span><div><strong>${n}</strong><p>${t}</p></div>${icon('chevron-right')}</button>`).join('')}<div class="panel" style="margin-top:25px"><h3>Tus propuestas de Cupido</h3><p class="sub">${s.suggestions.length?s.suggestions.length+' presentaciones simuladas pendientes de respuesta.':'Todavía no has propuesto ninguna presentación.'}</p>${b('cupido','Hacer de Cupido','plain')}</div>`;}
function conversation(){return `${b('chat','← Conversaciones','plain')}<div class="row"><h1>Alex</h1>${b('safety',icon('shield'),'plain','aria-label="Opciones de seguridad"')}</div><span class="pill">Conversación ficticia</span><div class="bubble">¿Café y una playlist compartida?</div><div id="dn-messages"></div><form id="dn-form"><label>Tu mensaje de prueba<input id="dn-message" type="text" maxlength="200" placeholder="Escribe algo…" autocomplete="off"></label><button class="primary full" type="button" data-action="send">Añadir a la simulación</button></form><p class="hint">No se envía nada a otra persona.</p>`;}
function profile(){return `<div class="eyebrow">Tu espacio</div><h1>A tu manera<span class="accent">.</span></h1><div class="panel row"><div class="mini">T</div><div><h3>Tu perfil de prueba</h3><span class="sub">${s.role==='cupid'?'Cupido':'Jugador'}${s.claim?' · Insignia Cupido ✦':''}</span></div></div><h2>Hoy me apetece</h2><div class="grid">${b('player','Ser Jugador',s.role==='player'?'primary':'secondary')}${b('cupid','Ser Cupido',s.role==='cupid'?'primary':'secondary')}</div><label><input type="checkbox" id="dn-exposure" ${s.nightOn?'checked':''}> Mostrar mi perfil en Night</label><label><input type="checkbox" id="dn-share" ${s.shareRole?'checked':''}> Compartir mi rol con mis amigos</label><p class="hint">Preferencias de prueba. Tú eliges el modo; la hora no lo cambia automáticamente.</p><div class="listrow"><div><h3>Mi actividad de prueba</h3><p>${s.likes.length} likes · ${s.suggestions.length} propuestas de Cupido</p></div></div>${b('rewards','Recompensas y progreso →','plain full')}${b('safety','Privacidad y seguridad →','plain full')}${b('reset','Reiniciar demostración','secondary full')}`;}
const questions=['¿Qué plan improvisado te ha salido sorprendentemente bien?','¿Qué canción pondrías para romper el hielo?','¿Cuál sería una primera cita muy tú?','¿Qué detalle te hace querer seguir una conversación?'];
const truths=['Verdad: ¿qué te llama la atención antes de conocer a alguien?','Reto: inventa un nombre para el grupo.','Verdad: ¿qué plan siempre te conquista?','Reto: describe tu cita ideal con tres palabras.'];
function game(){const q=activeGame==='Preguntas'?questions:truths;return `${b('social','← La previa','plain')}<div class="eyebrow">Partida de ejemplo</div><h1>${activeGame}</h1><p class="sub">Puedes pasar una tarjeta o salir cuando quieras.</p><div class="gamecard"><span class="eyebrow">Carta ${s.game%4+1}</span><p></p><strong>${q[s.game%4]}</strong></div>${b('nextcard','Siguiente tarjeta','primary full')}${b('passcard','Paso esta vez','secondary full')}<p class="hint">Sin penalización por pasar. No se alteran conversaciones.</p>`;}
function render(){root.dataset.mode=s.mode;root.querySelectorAll('.mode button').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.action===s.mode)));const pages={home,explore,cupido,social,chat,profile,ranking,game,conversation};content.innerHTML=(pages[s.page]||home)();root.querySelector('nav').innerHTML=[['home','house','Inicio'],['explore','compass','Descubre'],['cupido','heart-handshake','Cupido'],['chat','message-circle','Chats'],['profile','user-round','Perfil']].map(([a,i,l])=>b(a,icon(i)+`<span>${l}</span>`,'',s.page===a?'aria-current="page"':'')).join('');if(s.page==='conversation'){const box=root.querySelector('#dn-messages');s.messages.forEach(t=>{const el=document.createElement('div');el.className='bubble mine';el.textContent=t;box.append(el);});}renderModal();if(globalThis.lucide)lucide.createIcons();}
function renderModal(){if(!modal){overlay.innerHTML='';return;}let title='',body='';if(modal==='night'){title='La noche, a tu manera';body=`<p class="sub">Elige tu rol para explorar Night. Entrar aquí no activa la visibilidad de tu perfil.</p><div class="grid">${b('nightplayer','Jugador','primary')}${b('nightcupid','Cupido','secondary')}</div>`;}if(modal==='filters'){title='Tu zona y tus intenciones';body=`<label>Zona aproximada<select><option>Madrid · ejemplo</option><option>Torrelodones · ejemplo</option></select></label><label>Me apetece<select><option>Conocer sin prisas</option><option>Amistad y planes</option><option>Una relación</option></select></label><p class="hint">Vista de preferencias; no hay búsqueda ni ubicación real.</p>${b('close','Listo','primary full')}`;}if(modal==='details'){title=p().name+', '+p().age;body=`<p>${p().bio}</p><p class="sub">Perfil ficticio para explorar la interfaz.</p>${b('safety','Bloquear o denunciar','secondary full')}`;}if(modal==='rewards'){title='Ser Cupido tiene su historia';body=`<p class="sub">Exploramos premios que también interesen a quien no busca pareja.</p><div class="listrow">✦ Insignias y reconocimiento</div><div class="listrow">↗ Retos entre amigos</div><div class="listrow">♡ Agradecimientos compartidos</div><p class="hint">Likes extra y visibilidad ganada jugando: ideas pendientes de diseño. Pagar no compra exposición.</p>${b('ranking','Ver mi progreso','primary full')}`;}if(modal==='plan'){title='Terraza y conversación';body=`<span class="pill">Plan ficticio</span><p>Un escenario para explorar cómo organizar una quedada con tu círculo.</p>${b('planjoin','Me apunto · simulación','primary full')}`;}if(modal==='cards'){title='Cartas entre amigos';body=`<p class="sub">Laboratorio de ideas del brainstorming.</p><div class="listrow">Comodín · propone otra pregunta</div><div class="listrow">Protección · pasa un reto</div><div class="listrow">Clausulazo · reglas pendientes</div><p class="hint">Los efectos sobre chats no están activados en este prototipo.</p>${b('questions','Probar una partida','primary full')}`;}if(modal==='safety'){title='Tú decides con quién';body=`<p class="sub">Acciones de muestra. No hay personas reales ni un servicio de moderación conectado.</p>${b('block','Simular bloqueo','secondary full')}${b('report','Simular denuncia','secondary full')}`;}overlay.innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="row"><h2>${title}</h2>${b('close',icon('x'),'plain','aria-label="Cerrar"')}</div>${body}</section></div>`;}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;if(a==='send'){const input=root.querySelector('#dn-message'),t=input.value.trim();if(t){s.messages.push(t);render();tell('Mensaje añadido localmente; no se ha enviado.');}return;}tell('');if(['home','explore','cupido','social','chat','profile','ranking','conversation'].includes(a)){s.page=a;modal=null;}else if(a==='day'){s.mode='day';modal=null;}else if(a==='night'){if(s.mode!=='night')modal='night';}else if(['player','cupid','nightplayer','nightcupid'].includes(a)){s.role=a.includes('cupid')?'cupid':'player';s.page=s.role==='cupid'?'cupido':'explore';if(a.startsWith('night'))s.mode='night';modal=null;}else if(a==='skip'){s.index++;}else if(a==='like'){s.likes.push(p().name);s.index++;tell('Like guardado en la prueba. No se ha generado un match.');}else if(a==='suggest'&&s.remaining>0){s.suggestions.push(p().name);s.remaining--;s.index++;tell('Presentación simulada. Pendiente de aceptación de ambas personas.');}else if(['filters','details','rewards','plan','cards','safety'].includes(a)){modal=a;}else if(a==='close'){modal=null;}else if(a==='join'){s.joined=!s.joined;tell(s.joined?'Has entrado al grupo de prueba.':'Has salido del grupo de prueba.');}else if(['questions','truth'].includes(a)){activeGame=a==='truth'?'Verdad o reto':'Preguntas';s.game=0;s.page='game';modal=null;}else if(['nextcard','passcard'].includes(a)){s.game++;if(a==='passcard')tell('Tarjeta pasada, sin penalización.');}else if(a==='claim'){s.claim=true;tell('Insignia de muestra añadida a tu perfil.');}else if(a==='planjoin'){modal=null;tell('Interés simulado. No existe una reserva ni una quedada real.');}else if(a==='block'||a==='report'){modal=null;tell(a==='block'?'Bloqueo simulado; no afecta a personas reales.':'Denuncia simulada; no se ha enviado a moderación.');}else if(a==='reset'){s={...defaults,suggestions:[],likes:[],messages:[]};modal=null;tell('Demostración reiniciada.');}render();save();});
root.addEventListener('change',e=>{if(!['dn-exposure','dn-share','dn-target'].includes(e.target.id))return;if(e.target.id==='dn-exposure'){s.nightOn=e.target.checked;tell('Preferencia de visibilidad actualizada solo en la prueba.');}if(e.target.id==='dn-share')s.shareRole=e.target.checked;if(e.target.id==='dn-target'){const name=e.target.selectedIndex?'Marcos':'Lucía';root.querySelector('#dn-target-name').textContent=name;root.querySelector('#dn-target-letter').textContent=name[0];}save();});
root.addEventListener('submit',e=>{if(e.target.id!=='dn-form')return;e.preventDefault();const input=root.querySelector('#dn-message'),t=input.value.trim();if(t){s.messages.push(t);render();tell('Mensaje añadido localmente; no se ha enviado.');}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dn-message'){e.preventDefault();root.querySelector('[data-action=send]').click();}if(e.key==='Escape'&&modal){modal=null;render();}});
window.addEventListener('openai:set_globals',e=>{const before=[s.mode,s.page,s.role].join('|');restore(e.detail?.globals?.widgetState?.modelContent);if(before!==[s.mode,s.page,s.role].join('|'))render();});
render();
if(globalThis.Tweak){const design={radius:24};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--radius',design.radius+'px')});tweak.addSlider(design,'radius',{label:'Redondez de las tarjetas',min:10,max:30,unit:'px'});}
})();
</script>
