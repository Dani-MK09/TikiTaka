services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tikitaka
      POSTGRES_USER: tikitaka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or infra/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikitaka -d tikitaka"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
